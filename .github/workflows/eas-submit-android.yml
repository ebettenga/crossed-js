name: Release Android Play Store build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Existing EAS build ID to submit (leave empty to build first)"
        required: false
        default: ""

jobs:
  eas-submit-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production Android artifact
        if: ${{ inputs.build_id == '' }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait

      - name: Submit production build to Play Console
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > eas-build-key.json
          if [ -n "$BUILD_ID" ]; then target="--id $BUILD_ID"; else target="--latest"; fi
          eas submit \
            --platform android \
            --profile production \
            $target \
            --non-interactive
          rm -f eas-build-key.json
